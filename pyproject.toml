[project]
name = "localchart"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Shivam Shelar", email = "shivam.shelar.87@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.5",
    "mlx-lm>=0.32.2",
    "numpy>=2.5.4",
    "openai>=3.50.0",
    "pydantic>=2.14.3",
    "pytest>=9.2.0",
    "requests>=2.34.2",
    "sentence-transformers>=6.3.0",
    "streamlit>=1.67.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
localchart = "localchart:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"
